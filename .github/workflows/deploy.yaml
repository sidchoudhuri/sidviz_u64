name: Deploy to itch.io

on:
  release:
    types: [published]
  workflow_dispatch: # Clean manual trigger with no unneeded inputs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Grab your build binaries directly from the workflow artifacts
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      # 2. Install Butler
      - name: Install butler
        run: |
          mkdir -p ~/bin
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d ~/bin
          chmod +x ~/bin/butler
          echo "$HOME/bin" >> $GITHUB_PATH

      # 3. Push to itch.io
      - name: Push Build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Use a simple fallback for the version name string
          VERSION="${{ github.event.release.tag_name || github.sha }}"

          # Push Windows Executable
          butler push ./dist/sidviz_u64-Windows.exe sidchoudhuri/sidviz:windows-64 --userversion "$VERSION"
          
          # Push Linux Binary
          butler push ./dist/sidviz_u64-Linux sidchoudhuri/sidviz:linux-64 --userversion "$VERSION"
          
          # Push macOS Binary
          butler push ./dist/sidviz_u64-macOS sidchoudhuri/sidviz:osx-64 --userversion "$VERSION"
