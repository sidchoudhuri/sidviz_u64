name: Deploy to itch.io

on:
  release:
    types: [published] # Triggers on GitHub Release
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Download the specific binaries generated by your build workflow
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.11
        with:
          repository: "${{ github.repository }}"
          tag: "${{ github.event.release.tag_name }}"
          fileName: "*" # Downloads all assets (Linux, macOS, Windows exe)
          out-file-path: "./dist"

      # 2. Install Butler (Kept your efficient manual installation script)
      - name: Install butler
        run: |
          mkdir -p ~/bin
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d ~/bin
          chmod +x ~/bin/butler
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify butler installation
        run: butler version

      # 3. Push each platform binary to its respective itch.io channel
      - name: Push Build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Push Windows Executable
          butler push ./dist/sidviz_u64-Windows.exe sidchoudhuri/sidviz:windows-64 --userversion "${{ github.event.release.tag_name }}"
          
          # Push Linux Binary
          butler push ./dist/sidviz_u64-Linux sidchoudhuri/sidviz:linux-64 --userversion "${{ github.event.release.tag_name }}"
          
          # Push macOS Binary
          butler push ./dist/sidviz_u64-macOS sidchoudhuri/sidviz:osx-64 --userversion "${{ github.event.release.tag_name }}"
