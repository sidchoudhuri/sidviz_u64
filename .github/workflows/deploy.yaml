name: Deploy to itch.io

on:
  release:
    types: [published] # Triggers on GitHub Release
  workflow_dispatch: # Manual trigger
    inputs:
      reason:
        description: 'Latest Release'
        required: false
        default: 'Manually deployed'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Download Release Assets
      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist
          
          # If triggered by a release event, use that specific tag.
          # If triggered manually, query GitHub for the absolute newest release tag.
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
          else
            echo "Manual run detected. Finding the latest available release tag..."
            TARGET_TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
            echo "Error: No releases found in this repository."
            exit 1
          fi
          
          echo "Downloading assets for tag: $TARGET_TAG"
          gh release download "$TARGET_TAG" --repo "${{ github.repository }}" --dir ./dist --pattern "*"

      # 2. Install Butler (Kept your efficient manual installation script)
      - name: Install butler
        run: |
          mkdir -p ~/bin
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d ~/bin
          chmod +x ~/bin/butler
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify butler installation
        run: butler version

      # 3. Push each platform binary to its respective itch.io channel
      - name: Push Build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Push Windows Executable
          butler push ./dist/sidviz_u64-Windows.exe sidchoudhuri/sidviz:windows-64 --userversion "${{ github.event.release.tag_name }}"
          
          # Push Linux Binary
          butler push ./dist/sidviz_u64-Linux sidchoudhuri/sidviz:linux-64 --userversion "${{ github.event.release.tag_name }}"
          
          # Push macOS Binary
          butler push ./dist/sidviz_u64-macOS sidchoudhuri/sidviz:osx-64 --userversion "${{ github.event.release.tag_name }}"
